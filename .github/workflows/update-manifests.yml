# ==========================================
# Хеши образцов winget, Scoop и Homebrew
# ==========================================

# Переписывает версию и хеши в packaging/ по файлу SHA256SUMS
# и открывает pull request.
# Теги и страницы Release эта задача не создаёт и не меняет.
#
# Выпуск публикует build.yml тем же GITHUB_TOKEN. Событие, созданное
# этим токеном, другие workflow не запускает, поэтому триггера
# `release: published` здесь нет. Сборка вызывает этот файл через
# workflow_call после задачи release. Ручной запуск остаётся.
name: Update manifests

permissions:
  contents: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      version:
        description: Версия выпуска, например v1.2.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Версия выпуска, например 1.2.1
        required: true
        type: string

jobs:
  update:
    # Сборка передаёт только тег без дефиса. Ручной запуск версию не фильтрует.
    if: github.event_name == 'workflow_dispatch' || !contains(inputs.version, '-')
    runs-on: ubuntu-latest
    steps:
      # Вызов со сборки по тегу смотрит на коммит тега. Образцы берём
      # с основной ветки, чтобы pull request шёл от её верхушки.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Обновить манифесты из SHA256SUMS
        id: manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          chmod +x scripts/update-manifests.sh
          scripts/update-manifests.sh "$VERSION"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Манифесты уже совпадают с выпуском."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Открыть pull request
        if: steps.manifests.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          version="${VERSION#v}"
          tag="v${version}"
          branch="packaging/manifests-${tag}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add \
            packaging/winget \
            packaging/scoop/norka.json \
            packaging/homebrew/norka.rb
          git commit -m "Обновить манифесты для ${tag}"
          git push -u origin "$branch"

          existing="$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Pull request #${existing} для ${branch} уже открыт."
            exit 0
          fi

          err="$(mktemp)"
          if ! gh pr create \
            --base "$BASE" \
            --head "$branch" \
            --title "Манифесты ${tag}" \
            --body "$(cat <<EOF
          Версия и хеши в образцах winget, Scoop и Homebrew взяты из \`SHA256SUMS\` выпуска ${tag}.

          Теги и выпуски этот workflow не создаёт и не меняет.
          EOF
          )" >"$err" 2>&1; then
            cat "$err" >&2
            if grep -q 'not permitted to create or approve pull requests' "$err"; then
              compare="https://github.com/${GITHUB_REPOSITORY}/compare/${BASE}...${branch}"
              echo "Actions не может открывать pull request: в настройках репозитория выключено разрешение."
              echo "Ветка ${branch} уже отправлена. Сравнение: ${compare}"
              echo "::notice title=Манифесты ${tag}::Ветка ${branch} отправлена. Pull request не создан: ${compare}"
              rm -f "$err"
              exit 0
            fi
            rm -f "$err"
            exit 1
          fi
          cat "$err"
          rm -f "$err"
