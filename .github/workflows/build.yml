# ==========================================
# Часть 1. Основные сведения о рабочем процессе
# ==========================================

# Это имя видно на вкладке Actions в репозитории GitHub.
# Можно задать любое, обычно "Build" или "CI/CD".
name: Build

# Права GITHUB_TOKEN, нужные для создания Release
permissions:
  contents: write  # запись: создать release и загрузить файлы
  actions: read    # чтение: скачать artifacts

# `on` — триггер. Он задаёт, когда запускать задачи ниже.
on:
  # `push` срабатывает, когда код отправляют в репозиторий GitHub.
  push:
    # Ограничение: рабочий процесс запускается только для этих веток.
    # Отправка в ветку вроде "test-bug" его не запустит и не потратит ресурсы.
    branches:
      - main
      - master
      - release/* # звёздочка — любые ветки с префиксом release/, например release/v1.0
    
    # Дополнительно: запуск и при отправке тега версии.
    # Обычно релиз помечают так: `git tag v1.0.0`, затем `git push --tags`.
    tags:
      - "v*"       # все теги на v, например v1.0.0, v2.1.3

  # Сборка на pull request, чтобы проверить Linux/Windows/macOS до слияния.
  # Публикация релиза по-прежнему только на теге v*.
  pull_request:

  # `workflow_dispatch` — ручной запуск.
  # После этой строки на странице GitHub Actions появляется кнопка "Run workflow":
  # сборку можно запустить вручную, не отправляя новый код.
  workflow_dispatch:


# ==========================================
# Часть 2. Задачи (Jobs)
# ==========================================

# В `jobs` описано, что именно выполнять.
# По умолчанию задачи (например build-macos и build-windows) стартуют параллельно.
jobs:

  # ----------------------------------------
  # Задача 1: сборка версии для macOS
  # ----------------------------------------
  build-macos:
    # `runs-on` задаёт операционную систему облачного сервера.
    # `macos-latest` — свежая виртуальная машина Mac от GitHub.
    runs-on: macos-latest
    
    # `steps` — шаги задачи, они идут строго по порядку.
    steps:
      # Шаг 1. Получить код: клонировать проект с GitHub на эту машину Mac.
      - name: Checkout
        uses: actions/checkout@v4

      # Шаг 2. Установить Go (версия синхронизирована с локальной: 1.26).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26" # та же версия Go, что и локально
          cache: true        # кэш скачанных зависимостей Go, следующие запуски быстрее

      # Шаг 3. Установить Node.js (нужен фронтенду Wails, версия 24).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # та же версия Node, что и локально

      # Шаг 4. Установить менеджер пакетов pnpm (версия 10).
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10        # та же версия pnpm, что и локально

      # Шаг 5. Попробовать взять уже собранный Wails CLI из облачного кэша.
      - name: Cache Wails CLI
        id: cache-wails      # идентификатор шага, чтобы следующий шаг прочитал результат
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails                  # путь к файлу в кэше
          key: ${{ runner.os }}-wails-cli-v2.16.0 # уникальное имя кэша, с именем системы, чтобы не пересекаться

      # Шаг 6. Установить Wails CLI.
      # `if`: ставить заново, только если кэш не сработал (первый запуск или кэш устарел).
      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Шаг 7. Сборка: Wails компилирует Go и фронтенд в приложение macOS.
      # darwin/universal — одна сборка для Intel и чипов M1/M2/M3/M4.
      - name: Build macOS app
        run: wails build -platform darwin/universal

      # Шаг 8. Установить create-dmg.
      # Сторонний инструмент для DMG: свой фон и точная раскладка окна.
      - name: Install create-dmg
        run: brew install create-dmg

      # Собрать установщик с фоном через create-dmg.
      # Шаг 9. Создать DMG (с лучшей совместимостью по безопасности)
      - name: Create DMG Installer
        run: |
          cd build/bin
          
          # 1. Дать исполняемому файлу право на запуск.
          # Wails кладёт его в Contents/MacOS/.
          chmod +x "norka.app/Contents/MacOS/norka"
          
          # 2. Снять атрибут карантина и лишние метаданные,
          # чтобы в пакет не попала пометка «нужно проверить».
          xattr -cr "norka.app"
          
          # 3. Подпись Ad-hoc (локальная подпись без сертификата разработчика).
          # Для открытого проекта без сертификата это говорит macOS:
          # «нотаризации нет, но локальная проверка подписи пройдена» — реже появляется ошибка «повреждено».
          codesign --force --deep --sign - "norka.app"
          
          # 4. Фон для Retina: склеить 1x и @2x в один TIFF (tiffutil есть в любой macOS).
          # Если склейка не удалась, остаётся обычный PNG.
          BG="../../dmg-bg.png"
          if tiffutil -cathidpicheck ../../dmg-bg.png ../../dmg-bg@2x.png -out dmg-bg.tiff; then
            BG="dmg-bg.tiff"
          fi

          # 5. Запустить create-dmg
          # Высота окна 428 = фон 400 + заголовок окна Finder (~28), чтобы фон был виден целиком.
          create-dmg \
            --volname "norka" \
            --background "$BG" \
            --window-pos 200 120 \
            --window-size 600 428 \
            --icon-size 100 \
            --icon "norka.app" 110 200 \
            --hide-extension "norka.app" \
            --app-drop-link 490 200 \
            "norka.dmg" \
            "norka.app"  

      # Шаг 10. Загрузить готовый DMG в хранилище GitHub.
      # Виртуальная машина после задачи уничтожается, без загрузки сборка пропадёт.
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: norka-macos
          path: build/bin/norka.dmg

  # ----------------------------------------
  # Задача 2: сборка версии для Windows
  # (та же логика, что у macOS, только среда — Windows)
  # ----------------------------------------
  build-windows:
    # Свежая виртуальная машина Windows
    runs-on: windows-latest
    # Секреты подписи читаются в env, чтобы шаг можно было пропустить, когда их нет.
    # Пустое значение — шаг не запускается, в релиз уходит неподписанный norka.exe.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # В Windows другой разделитель пути, файл называется wails.exe
      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~\go\bin\wails.exe
          key: ${{ runner.os }}-wails-cli-v2.16.0

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Собрать 64-битную программу для Windows
      - name: Build Windows app
        run: wails build -platform windows/amd64

      # Подпись необязательна. Сначала Azure Artifact Signing, если заданы все шесть секретов.
      # Иначе PFX через signtool. Иначе файл остаётся неподписанным. Имя — norka.exe.
      - name: Sign with Azure Artifact Signing
        id: azure-sign
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != '' && env.AZURE_SIGNING_ENDPOINT != '' && env.AZURE_SIGNING_ACCOUNT != '' && env.AZURE_CERT_PROFILE_NAME != ''
        uses: azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}/build/bin
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Norka

      - name: Sign with PFX certificate
        if: steps.azure-sign.outcome == 'skipped' && env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: ./packaging/windows/sign-pfx.ps1

      # Загрузить файлы .exe в хранилище
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: norka-windows
          path: build/bin/*.exe

  # ----------------------------------------
  # Задача: сборка Linux (AppImage, deb, tar.gz)
  # ----------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Ubuntu 24.04 отдаёт WebKitGTK 4.1. Тег webkit2_41 выбирает эту сборку Wails.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config imagemagick curl ca-certificates squashfs-tools

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails
          key: ${{ runner.os }}-wails-cli-v2.16.0

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Linux app
        run: wails build -platform linux/amd64 -tags webkit2_41

      # frontend/dist появляется после сборки Wails: его вшивает go:embed.
      - name: Test and cross-compile
        run: |
          go test -tags webkit2_41 ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/norka.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./internal/...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./internal/...

      - name: Package AppImage, deb and tar.gz
        run: |
          chmod +x packaging/linux/package.sh
          packaging/linux/package.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: norka-linux
          path: |
            build/bin/norka-x86_64.AppImage
            build/bin/*.deb
            build/bin/*.tar.gz


  # ----------------------------------------
  # Задача 3: автоматическая публикация Release
  # ----------------------------------------
  release:
    # `needs`: публикация после macOS, Windows и Linux.
    needs: [build-macos, build-windows, build-linux]
    
    # Публикация лёгкая, хватает самой быстрой и дешёвой машины Ubuntu.
    runs-on: ubuntu-latest
    
    # `if`: публиковать только если запуск вызван тегом на "v" (например v1.0.0).
    # Обычный push кода заканчивается сборками, этот шаг пропускается.
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      # Шаг 1. Заметки к выпуску лежат в репозитории: docs/releases/v1.2.3.md.
      # На этой машине их ещё нет — сюда пока приезжают только собранные файлы.
      # Клонируем одну папку: остальной проект для публикации не нужен.
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      # Шаг 2. Имя файла совпадает с тегом. Нет файла — публикуем как раньше, без текста.
      # Пустой path действие softprops не читает и из-за этого не падает.
      - name: Look for release notes
        id: notes
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            echo "path=${notes_file}" >> "$GITHUB_OUTPUT"
            echo "Нашлись заметки: ${notes_file}"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Файла ${notes_file} нет. Публикуем выпуск без текста."
          fi

      # Шаг 3. Скачать собранное приложение macOS из архива задачи build-macos.
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: norka-macos
          path: artifacts/macos      # куда положить скачанное на этой машине

      # Шаг 4. Скачать сборку Windows.
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: norka-windows
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: norka-linux
          path: artifacts/linux

      # sha256 всех файлов релиза. Приложение сверяет digest GitHub, а если его нет — этот список.
      - name: Write SHA256SUMS
        run: |
          cd artifacts
          find windows macos linux -type f -print0 | sort -z | xargs -0 -r sha256sum | while read -r sum path; do
            printf '%s  %s\n' "$sum" "$(basename "$path")"
          done > SHA256SUMS
          cat SHA256SUMS

      # Шаг 5. Официальным действием GitHub создать страницу Release.
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # Все файлы из artifacts прикрепить к странице Release
          files: |
            artifacts/windows/*
            artifacts/macos/*
            artifacts/linux/*
            artifacts/SHA256SUMS
          draft: false           # false — опубликовать сразу, без черновика
          # Текст этой страницы приложение показывает в окне «Что нового».
          # path — это docs/releases/<тег>.md, если шаг выше файл нашёл.
          # Пустая строка значит «файла нет»: описание остаётся пустым, задача не падает.
          body_path: ${{ steps.notes.outputs.path }}
          # Дефис в теге (например v1.2.0-beta.1) — предварительный выпуск.
          # Без дефиса — обычный стабильный выпуск.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          # Токен даёт действию право создать Release в репозитории.
          # GITHUB_TOKEN GitHub Actions выдаёт сам, отдельно его заводить не нужно.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # WinGet только если владелец уже положил WINGET_TOKEN.
      # Первую версию пакета NorkaApp.Norka всё равно нужно отправить в winget-pkgs вручную:
      # действие откажется работать, пока пакета там нет. См. docs/DISTRIBUTION.md.
      - name: Detect WinGet token
        id: winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "WINGET_TOKEN is not set; skipping winget-releaser"
          fi

      # Предварительный выпуск (в теге есть дефис) в WinGet не отправляем.
      - name: Publish to WinGet
        if: steps.winget.outputs.enabled == 'true' && !contains(github.ref_name, '-')
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: NorkaApp.Norka
          installers-regex: '^norka\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  # Хеши образцов winget, Scoop и Homebrew.
  # Выпуск выше создаёт GITHUB_TOKEN, и из-за этого событие release
  # другие workflow не запускает. Вызываем обновление сами, когда
  # публикация тега без дефиса прошла. Теги и выпуск этот шаг не меняет.
  update-manifests:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && needs.release.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-manifests.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
